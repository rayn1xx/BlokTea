name: Backend tests

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  workflow_dispatch:

# новый пуш в ту же ветку отменяет устаревший прогон
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  unit:
    name: Unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt -c requirements.lock

      - name: Run unit tests
        run: pytest -m unit -ra

  integration:
    name: Integration, API, migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_USER: bloktea
          POSTGRES_PASSWORD: bloktea
          POSTGRES_DB: bloktea
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bloktea -d bloktea"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7.4.5-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10

    # тестовую базу bloktea_test и Redis db 15 выставляет tests/conftest.py
    env:
      POSTGRES_USER: bloktea
      POSTGRES_PASSWORD: bloktea
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      REDIS_HOST: localhost
      REDIS_PORT: 6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt -c requirements.lock

      - name: Run integration, API and migration tests
        run: pytest -m "not unit" -ra
