services:
  db:
    image: postgres:16.10-alpine
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bloktea}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bloktea}
      POSTGRES_DB: ${POSTGRES_DB:-bloktea}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4.5-alpine
    # AOF: refresh-сессии переживают перезапуск контейнера
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  # моки внешних систем: Альфа-Бизнес, ЕГРЮЛ/ЕГРИП, реестр МСП, БКИ, ФНС (данные синтетические)
  mocks:
    build: ./backend
    environment:
      MOCKS_DOWN: ${MOCKS_DOWN:-}
    command:
      ["uvicorn", "mocks.main:app", "--host", "0.0.0.0", "--port", "8100"]
    ports:
      - "8100:8100"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8100/health')",
        ]
      interval: 3s
      timeout: 3s
      retries: 10

  # LLM (раздел 8 ТЗ), только с профилем: docker compose --profile llm up
  # без профиля бэкенд работает на шаблонах-заглушках, /health отдаёт llm: stub
  ollama:
    image: ollama/ollama:0.40.9
    profiles: ["llm"]
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  # init: скачивает модели из LLM_MODEL_TEXT и LLM_MODEL_VISION и завершается
  ollama-init:
    image: ollama/ollama:0.40.9
    profiles: ["llm"]
    environment:
      OLLAMA_HOST: http://ollama:11434
      LLM_MODEL_TEXT: ${LLM_MODEL_TEXT:-qwen3.5:9b}
      LLM_MODEL_VISION: ${LLM_MODEL_VISION:-}
    entrypoint:
      [
        "sh",
        "-c",
        'ollama pull "$$LLM_MODEL_TEXT" && if [ -n "$$LLM_MODEL_VISION" ]; then ollama pull "$$LLM_MODEL_VISION"; fi',
      ]
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      # внутри сети compose сервисы доступны по имени
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-bloktea}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bloktea}
      POSTGRES_DB: ${POSTGRES_DB:-bloktea}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me}
      MOCKS_BASE_URL: http://mocks:8100
      UPLOAD_DIR: /app/data/uploads
      OLLAMA_BASE_URL: http://ollama:11434
    # миграции, затем демо-данные (если SEED_DEMO=true и базы ещё нет)
    command:
      [
        "sh",
        "-c",
        "alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000",
      ]
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mocks:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  ollama-models:
  db-data:
  redis-data:
  uploads:
