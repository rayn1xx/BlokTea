[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# категория проставляется автоматически по папке теста (tests/conftest.py)
markers =
    unit: изолированные тесты без БД и сети
    integration: репозитории на настоящих Postgres и Redis
    api: HTTP-эндпоинты целиком, через ASGI
    migrations: миграции alembic
